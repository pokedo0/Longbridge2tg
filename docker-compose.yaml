services:
  longbridge2tg:
    #    build: .
    image: ghcr.io/pokedo0/longbridge2tg:latest
    pull_policy: always
    container_name: longbridge2tg
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 配置文件放在本文件同目录下
      - ./config.yaml:/etc/longbridge2tg/config.yaml:ro
